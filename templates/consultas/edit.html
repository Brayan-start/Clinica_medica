{% extends 'base.html' %}
{% block title %} Editar Consulta {% endblock %}
{% block content %}
<h1>Editar Consulta</h1>
<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label class="form-label">Fecha y Hora</label>
        <input type="datetime-local" name="fecha" class="form-control" value="{{ consulta.fecha.strftime('%Y-%m-%dT%H:%M') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Paciente</label>
        <select name="id_paciente" class="form-select" required>
            {% for p in pacientes %}
            <option value="{{ p.id_paciente }}" {% if p.id_paciente == consulta.id_paciente %}selected{% endif %}>{{ p.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Médico</label>
        <select name="id_medico" class="form-select" required>
            {% for m in medicos %}
            <option value="{{ m.id_medico }}" {% if m.id_medico == consulta.id_medico %}selected{% endif %}>{{ m.nombre }} ({{ m.especialidad }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Diagnóstico</label>
        <textarea name="diagnostico" class="form-control" rows="3" required>{{ consulta.diagnostico }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Tratamiento</label>
        <textarea name="tratamiento" class="form-control" rows="3" required>{{ consulta.tratamiento }}</textarea>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a href="{{ url_for('consulta.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
