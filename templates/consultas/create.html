{% extends 'base.html' %}
{% block title %} Nueva Consulta {% endblock %}
{% block content %}
<h1>Registrar Nueva Consulta</h1>
<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label class="form-label">Fecha y Hora</label>
        <input type="datetime-local" name="fecha" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Paciente</label>
        <select name="id_paciente" class="form-select" required>
            <option value="">Seleccione un paciente</option>
            {% for p in pacientes %}
            <option value="{{ p.id_paciente }}">{{ p.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Médico</label>
        <select name="id_medico" class="form-select" required>
            <option value="">Seleccione un médico</option>
            {% for m in medicos %}
            <option value="{{ m.id_medico }}">{{ m.nombre }} ({{ m.especialidad }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Diagnóstico</label>
        <textarea name="diagnostico" class="form-control" rows="3" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Tratamiento</label>
        <textarea name="tratamiento" class="form-control" rows="3" required></textarea>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar Consulta</button>
        <a href="{{ url_for('consulta.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
