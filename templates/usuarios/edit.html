{% extends 'base.html' %}
{% block title %} Editar Usuario {% endblock %}
{% block content %}
<h1>Editar Usuario</h1>
<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" value="{{ usuario.username }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Password (dejar en blanco para no cambiar)</label>
        <input type="password" name="password" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Rol</label>
        <select name="rol" class="form-select">
            <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
            <option value="doctor" {% if usuario.rol == 'doctor' %}selected{% endif %}>Doctor</option>
            <option value="recepcionista" {% if usuario.rol == 'recepcionista' %}selected{% endif %}>Recepcionista</option>
        </select>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a href="{{ url_for('usuario.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
