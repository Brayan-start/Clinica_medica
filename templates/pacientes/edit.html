{% extends 'base.html' %}
{% block title %} Editar Paciente {% endblock %}
{% block content %}
<h1>Editar Paciente</h1>
<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" name="nombre" class="form-control" value="{{ paciente.nombre }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Edad</label>
        <input type="number" name="edad" class="form-control" value="{{ paciente.edad }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" name="direccion" class="form-control" value="{{ paciente.direccion }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" value="{{ paciente.telefono }}" required>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a href="{{ url_for('paciente.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
